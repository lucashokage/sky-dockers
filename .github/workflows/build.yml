name: build

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - tag: node18-chromium
            context: images/node-chromium
            args: NODE_VERSION=18
            test: chromium --headless --no-sandbox --disable-gpu --dump-dom "data:text/html,<p>ok</p>" | grep -q ok
          - tag: node20-chromium
            context: images/node-chromium
            args: NODE_VERSION=20
            test: chromium --headless --no-sandbox --disable-gpu --dump-dom "data:text/html,<p>ok</p>" | grep -q ok
          - tag: node22-chromium
            context: images/node-chromium
            args: NODE_VERSION=22
            test: chromium --headless --no-sandbox --disable-gpu --dump-dom "data:text/html,<p>ok</p>" | grep -q ok
          - tag: node24-chromium
            context: images/node-chromium
            args: NODE_VERSION=24
            test: chromium --headless --no-sandbox --disable-gpu --dump-dom "data:text/html,<p>ok</p>" | grep -q ok
          - tag: python3.12-chromium
            context: images/python-chromium
            args: PYTHON_VERSION=3.12
            test: chromium --headless --no-sandbox --disable-gpu --dump-dom "data:text/html,<p>ok</p>" | grep -q ok && chromedriver --version
          - tag: python3.11-chromium
            context: images/python-chromium
            args: PYTHON_VERSION=3.11
            test: chromium --headless --no-sandbox --disable-gpu --dump-dom "data:text/html,<p>ok</p>" | grep -q ok && chromedriver --version
          - tag: nginx-php
            context: images/nginx-php
            args: ""
            test: (SERVER_PORT=8080 sky-web &) && sleep 4 && curl -sf http://127.0.0.1:8080 | grep -q "Sky web funcionando"

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          build-args: ${{ matrix.args }}
          load: true
          tags: sky-test:${{ matrix.tag }}

      - name: test
        run: docker run --rm --entrypoint sh -w /home/container sky-test:${{ matrix.tag }} -c '${{ matrix.test }}'

      - name: push
        run: |
          IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/sky-dockers:${{ matrix.tag }}
          docker tag sky-test:${{ matrix.tag }} "$IMAGE"
          docker push "$IMAGE"
